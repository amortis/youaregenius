{% if results %}
  <div class="row g-3">
    {% for r in results %}
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body d-flex align-items-center gap-3">
            {% if r.cover_url %}
              <img src="{{ r.cover_url }}" alt="" width="72" height="72" class="rounded" loading="lazy">
            {% endif %}
            <div class="flex-grow-1">
              <div class="fw-semibold">{{ r.full_title }}</div>
              <div class="text-muted small">{{ r.artist }}</div>
            </div>
            <form action="{{ url_for('tracks.import_track', genius_id=r.genius_id) }}" method="post">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="btn btn-primary">Добавить</button>
            </form>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-muted">Ничего не найдено. Попробуйте другой запрос.</div>
{% endif %}
